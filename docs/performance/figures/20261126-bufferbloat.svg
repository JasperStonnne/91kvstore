    <dc:title>TCP buffer diagnostic: same NIC path, different buffering behavior</dc:title>
    <dc:description>Default 30s controls: n=3/direction; socket-window diagnostic: n=1/direction, variation=N/A.
-w 131072: RTT ~61-63ms -&gt; ~1.1ms, receiver ~0.44-0.46 -&gt; ~1.14-1.15Gb/s. Supports queueing/bufferbloat, not a hardware RDMA claim.</dc:description>
