    <dc:title>Nonblocking SAVE: retained Stage 2 million-record measurements</dc:title>
    <dc:description>1 round/frequency; variation=N/A. Python serial HSET; 1M unique 32B keys + 128B values; all restarts verified.
Background save time overlaps writes; do not stack it. 1k total -83.80% includes fewer snapshots, not a 6.17x disk-I/O speedup.</dc:description>
