# Primary 配置格式示例：客户端和复制控制共用 service_port。
# socket 模式的增量也走 service_port；ebpf 模式由采集端独立监听增量端口。
# 实际启动前将 bind_ip 改为本机 ACTIVE iWARP 网卡的 IPv4 地址。
# rdma_port 为必填项，快照全量只走 RDMA。
role = primary
bind_ip = 172.16.145.135
service_port = 29000
# 全量快照使用的独立 RDMA 监听端口。
rdma_port = 29747
log_level = info
persistence_mode = none

# 默认由 Primary 持有内存缓存。
replication_incremental_mode = socket

# 切换到独立 eBPF 采集时，先注释掉上面的 socket 设置，再取消以下两行的注释：
# replication_incremental_mode = ebpf
# replication_capture_port = 29005
#
# 在仓库根目录运行。先启动 Primary，再把它的 PID 传给采集进程：
# make all ebpf-capture
# bin/kvstore config/primary.conf &
# PRIMARY_PID=$!
# sudo bin/kvstore-ebpf-capture "$PRIMARY_PID" build/ebpf_capture.bpf.o --listen 172.16.145.135:29005
#
# 采集进程独立监听增量 TCP 端口；它必须与 Primary 配置相同，且可由 Replica 访问。
# 看到 replication uprobe attached 和监听就绪后，再启动 Replica。
# 加载完成握手后 Replica 直接连接 29005；Primary 的 29000 仅保留控制连接。
