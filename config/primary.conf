# Primary 配置格式示例：客户端和复制控制共用 service_port。
# socket 模式的增量也走 service_port；ebpf 模式由采集端独立监听增量端口。
# 实际启动前将 bind_ip 改为本机 ACTIVE iWARP 网卡的 IPv4 地址。
# rdma_port 为必填项，快照全量只走 RDMA。
role = primary
bind_ip = 172.16.145.135
service_port = 29000
# 全量快照使用的独立 RDMA 监听端口。
rdma_port = 29747
log_level = info
persistence_mode = none

# 默认由 Primary 持有内存缓存。
replication_incremental_mode = socket

# 切换到独立 eBPF 采集时，先注释掉上面的 socket 设置，再取消以下设置的注释：
# replication_incremental_mode = ebpf
# 采集端自动连接 Replica 的 service_port，无需 replication_capture_port。
#
# 在仓库根目录运行。先启动 Primary，再把它的 PID 传给采集进程：
# make all ebpf-capture
# bin/kvstore config/primary.conf &
# PRIMARY_PID=$!
# sudo bin/kvstore-ebpf-capture "$PRIMARY_PID" build/ebpf_capture.bpf.o
#
# 采集进程默认主动推流，不监听端口。看到 capture push client ready 后启动 Replica。
# Replica 在 PSYNC 中公布 service_port；全量结束后 Primary 就绪探针触发采集端连接 Replica。
# Primary 的 service_port 仅保留原控制连接。
