# Replica 配置格式示例：primary_port 指向 Primary 的 TCP service_port。
# 实际启动前将 primary_host 改为 Primary 的 iWARP 网卡 IPv4 地址。
# RDMA 端口从 Primary 通知获得，Replica 不单独配置 rdma_port。
# 自己的 Snapshot 和 AOF 必须放在独立工作目录。

role = replica
bind_ip = 172.16.145.136
service_port = 29001
primary_host = 172.16.145.135
primary_port = 29000
log_level = info
persistence_mode = legacy_hybrid
