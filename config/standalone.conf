# 单机示例。空行和整行 # 注释有效；不支持写在字段后面的行尾注释。
# Snapshot 和 AOF 仍写在进程的当前工作目录；每个实例请使用独立工作目录。

role = standalone
bind_ip = 127.0.0.1
service_port = 29002
log_level = info
persistence_mode = snapshot

# 仅 standalone + snapshot 可配置；record 在恢复时记录并跳过损坏记录。
# 默认 file，整文件 CRC 失败会拒绝恢复。读取已有文件时按文件头标记解释。
snapshot_checksum = file
